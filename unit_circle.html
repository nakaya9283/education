<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>単位円とsin・cos・tan</title>
<style>
:root{--bg:#fff;--card:#f4f3ee;--tx:#1f1f1e;--tx2:#5f5e5a;--tx3:#888780;--ln:#b4b2a9;--ln2:#d3d1c7}
@media(prefers-color-scheme:dark){:root{--bg:#1f1f1e;--card:#2c2c2a;--tx:#f1efe8;--tx2:#b4b2a9;--tx3:#888780;--ln:#5f5e5a;--ln2:#444441}}
body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:420px;margin:0 auto}
h1{font-size:18px;font-weight:500;margin:0 0 12px}
.ctl{display:flex;align-items:center;gap:12px;margin-bottom:8px}
button{min-width:84px;padding:8px 12px;border:.5px solid var(--ln);border-radius:8px;background:transparent;color:var(--tx);font-size:14px;cursor:pointer}
input[type=range]{flex:1}
.num{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px;color:var(--tx2)}
input[type=number]{width:96px;padding:6px 10px;border:.5px solid var(--ln);border-radius:8px;background:transparent;color:var(--tx);font-size:16px}
svg{display:block;width:100%}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0 12px}
.m{background:var(--card);border-radius:8px;padding:8px 12px}
.m .l{font-size:12px;color:var(--tx2)}
.m .v{font-size:18px;font-weight:500}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.s{font-size:12px;fill:var(--tx2)}.q{font-size:11px;fill:var(--tx3)}
</style>
</head>
<body>
<div class="wrap">
<h1>単位円とsin・cos・tan</h1>
<div class="ctl">
<button id="play">▶ 再生</button>
<input type="range" id="ang" min="0" max="360" step="1" value="40" aria-label="角度θ">
</div>
<div class="num">
<label for="angnum">θ =</label>
<input type="number" id="angnum" step="any" value="40" aria-label="角度を数値で指定（度）">
<span>°（0〜360以外は自動で換算）</span>
</div>
<svg id="circ" viewBox="0 0 380 250">
<line x1="40" y1="125" x2="340" y2="125" stroke="var(--ln)" stroke-width=".5"/>
<line x1="190" y1="15" x2="190" y2="235" stroke="var(--ln)" stroke-width=".5"/>
<line x1="280" y1="15" x2="280" y2="235" stroke="var(--ln2)" stroke-width=".5" stroke-dasharray="3 3"/>
<circle cx="190" cy="125" r="90" fill="none" stroke="var(--tx3)" stroke-width="1"/>
<text x="326" y="141" class="s">x</text><text x="196" y="24" class="s">y</text><text x="284" y="141" class="q">1</text>
<path id="arc" fill="none" stroke="var(--tx2)" stroke-width="1"/>
<line id="ext" x1="190" y1="125" x2="280" y2="125" stroke="var(--tx2)" stroke-width="1" stroke-dasharray="4 3"/>
<line id="tn" x1="280" y1="125" x2="280" y2="125" stroke="#7F77DD" stroke-width="3"/>
<circle id="td" cx="280" cy="125" r="4" fill="#7F77DD"/>
<line id="rad" x1="190" y1="125" x2="280" y2="125" stroke="var(--tx2)" stroke-width="1.5"/>
<line id="cs" x1="190" y1="125" x2="280" y2="125" stroke="#378ADD" stroke-width="3"/>
<line id="sn" x1="280" y1="125" x2="280" y2="125" stroke="#D85A30" stroke-width="3"/>
<circle id="pt" cx="280" cy="125" r="7" fill="var(--tx)"/>
<circle id="hit" cx="280" cy="125" r="20" fill="transparent" style="cursor:grab;touch-action:none"/>
<text id="plab" x="290" y="115" style="font-size:13px;font-weight:500;fill:var(--tx)">P</text>
</svg>
<div class="grid">
<div class="m"><div class="l">角度 θ</div><div class="v"><span id="deg">40</span>° <span style="font-size:13px;color:var(--tx2);font-weight:400">(<span id="rad2">0.70</span> rad)</span></div></div>
<div class="m"><div class="l"><span class="dot" style="background:#7F77DD"></span>tan θ（接線の高さ）</div><div class="v" id="tan">0.84</div></div>
<div class="m"><div class="l"><span class="dot" style="background:#378ADD"></span>cos θ（x座標）</div><div class="v" id="cos">0.77</div></div>
<div class="m"><div class="l"><span class="dot" style="background:#D85A30"></span>sin θ（y座標）</div><div class="v" id="sin">0.64</div></div>
</div>
<svg id="wave" viewBox="0 0 380 170">
<line x1="30" y1="85" x2="360" y2="85" stroke="var(--ln)" stroke-width=".5"/>
<line x1="30" y1="20" x2="30" y2="150" stroke="var(--ln)" stroke-width=".5"/>
<text x="26" y="39" text-anchor="end" class="q">1</text><text x="26" y="134" text-anchor="end" class="q">-1</text>
<text x="30" y="166" text-anchor="middle" class="q">0°</text><text x="195" y="166" text-anchor="middle" class="q">180°</text><text x="360" y="166" text-anchor="middle" class="q">360°</text>
<path id="cw" fill="none" stroke="#378ADD" stroke-width="2"/>
<path id="sw" fill="none" stroke="#D85A30" stroke-width="2"/>
<line id="vl" x1="30" y1="25" x2="30" y2="145" stroke="var(--tx2)" stroke-width=".5" stroke-dasharray="3 3"/>
<circle id="cd" cx="30" cy="30" r="5" fill="#378ADD"/>
<circle id="sd" cx="30" cy="85" r="5" fill="#D85A30"/>
</svg>
<svg id="tanw" viewBox="0 0 380 170" style="margin-top:4px">
<line x1="30" y1="85" x2="360" y2="85" stroke="var(--ln)" stroke-width=".5"/>
<line x1="30" y1="15" x2="30" y2="155" stroke="var(--ln)" stroke-width=".5"/>
<line x1="112.5" y1="15" x2="112.5" y2="155" stroke="var(--tx3)" stroke-width=".5" stroke-dasharray="4 3"/>
<line x1="277.5" y1="15" x2="277.5" y2="155" stroke="var(--tx3)" stroke-width=".5" stroke-dasharray="4 3"/>
<text x="26" y="39" text-anchor="end" class="q">3</text><text x="26" y="136" text-anchor="end" class="q">-3</text>
<text x="30" y="167" text-anchor="middle" class="q">0°</text><text x="112" y="167" text-anchor="middle" class="q">90°</text><text x="277" y="167" text-anchor="middle" class="q">270°</text><text x="360" y="167" text-anchor="middle" class="q">360°</text>
<path id="tw" fill="none" stroke="#7F77DD" stroke-width="2"/>
<line id="tvl" x1="30" y1="20" x2="30" y2="150" stroke="var(--tx2)" stroke-width=".5" stroke-dasharray="3 3"/>
<circle id="tdw" cx="30" cy="85" r="5" fill="#7F77DD"/>
</svg>
</div>
<script>
var cx=190,cy=125,R=90,deg=40,playing=false,last=0;
var SPEED=0.02; /* deg/ms（元の半分） */
var $=function(i){return document.getElementById(i)};
var cp='',sp='';
for(var i=0;i<=120;i++){var t=i/120*2*Math.PI,x=30+i/120*330;
cp+=(i?'L':'M')+x.toFixed(1)+' '+(85-55*Math.cos(t)).toFixed(1);
sp+=(i?'L':'M')+x.toFixed(1)+' '+(85-55*Math.sin(t)).toFixed(1);}
$('cw').setAttribute('d',cp);$('sw').setAttribute('d',sp);
var tp='',pen=false;
for(var d=0;d<=360;d++){var tv=Math.tan(d*Math.PI/180);
if(Math.abs(tv)>3||Math.abs(Math.cos(d*Math.PI/180))<0.001){pen=false;continue;}
tp+=(pen?'L':'M')+(30+d/360*330).toFixed(1)+' '+(85-tv*23.3).toFixed(1);pen=true;}
$('tw').setAttribute('d',tp);
function render(){
var a=deg*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
var px=cx+R*c,py=cy-R*s;
$('rad').setAttribute('x2',px);$('rad').setAttribute('y2',py);
$('cs').setAttribute('x2',px);
$('sn').setAttribute('x1',px);$('sn').setAttribute('x2',px);$('sn').setAttribute('y2',py);
$('pt').setAttribute('cx',px);$('pt').setAttribute('cy',py);
$('hit').setAttribute('cx',px);$('hit').setAttribute('cy',py);
$('plab').setAttribute('x',px+(c>=0?10:-10));$('plab').setAttribute('y',py+(s>=0?-10:16));
$('plab').setAttribute('text-anchor',c>=0?'start':'end');
if(deg>1){var ar=24;$('arc').setAttribute('d','M'+(cx+ar)+' '+cy+' A'+ar+' '+ar+' 0 '+(deg>180?1:0)+' 0 '+(cx+ar*c).toFixed(1)+' '+(cy-ar*s).toFixed(1));}
else{$('arc').setAttribute('d','');}
var tn=Math.abs(c)<0.0001?(s>0?1e4:-1e4):s/c;
var u=R,ty=-R*tn;
if(Math.abs(ty)>105){ty=(ty>0?1:-1)*105;u=105/Math.abs(tn);}
$('ext').setAttribute('x2',cx+u);$('ext').setAttribute('y2',cy+ty);
$('tn').setAttribute('y2',cy+ty);
/* 値が負の線分は点線にする */
$('cs').setAttribute('stroke-dasharray',c<0?'6 4':'none');
$('sn').setAttribute('stroke-dasharray',s<0?'6 4':'none');
$('tn').setAttribute('stroke-dasharray',tn<0?'6 4':'none');
$('td').setAttribute('cx',cx+u);$('td').setAttribute('cy',cy+ty);
$('td').setAttribute('opacity',Math.abs(tn)*R>105?0:1);
var wx=30+deg/360*330;
$('vl').setAttribute('x1',wx);$('vl').setAttribute('x2',wx);
$('cd').setAttribute('cx',wx);$('cd').setAttribute('cy',85-55*c);
$('sd').setAttribute('cx',wx);$('sd').setAttribute('cy',85-55*s);
$('tvl').setAttribute('x1',wx);$('tvl').setAttribute('x2',wx);
$('tdw').setAttribute('cx',wx);$('tdw').setAttribute('cy',85-Math.max(-3,Math.min(3,tn))*23.3);
$('tdw').setAttribute('opacity',Math.abs(tn)>3?0:1);
$('deg').textContent=Math.round(deg);
$('rad2').textContent=a.toFixed(2);
$('cos').textContent=c.toFixed(2);
$('sin').textContent=s.toFixed(2);
$('tan').textContent=Math.abs(c)<0.01?'定義なし':tn.toFixed(2);
$('ang').value=Math.round(deg);
if(document.activeElement!==$('angnum'))$('angnum').value=Math.round(deg*10)/10;
}
function tick(ts){
if(!playing)return;
if(last){deg=(deg+(ts-last)*SPEED)%360;}
last=ts;render();requestAnimationFrame(tick);
}
$('play').addEventListener('click',function(){
playing=!playing;last=0;
$('play').textContent=playing?'■ 停止':'▶ 再生';
if(playing)requestAnimationFrame(tick);
});
$('ang').addEventListener('input',function(e){deg=+e.target.value;render();});
$('angnum').addEventListener('input',function(e){
var v=parseFloat(e.target.value);
if(isNaN(v))return;
playing=false;$('play').textContent='▶ 再生';
deg=((v%360)+360)%360;render();
});
var dragging=false;
function fromPointer(e){
var r=$('circ').getBoundingClientRect(),k=380/r.width;
var x=(e.clientX-r.left)*k-cx,y=cy-(e.clientY-r.top)*k;
var d=Math.atan2(y,x)*180/Math.PI;if(d<0)d+=360;deg=d;render();
}
$('hit').addEventListener('pointerdown',function(e){dragging=true;playing=false;$('play').textContent='▶ 再生';$('hit').setPointerCapture(e.pointerId);fromPointer(e);});
$('hit').addEventListener('pointermove',function(e){if(dragging)fromPointer(e);});
$('hit').addEventListener('pointerup',function(){dragging=false;});
render();
</script>
</body>
</html>
